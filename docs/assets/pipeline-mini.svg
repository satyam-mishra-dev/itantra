<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="620" viewBox="0 0 1780 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#455a64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1780" height="620" fill="#ffffff"/>

  <!-- Node 1: Speak -->
  <rect x="30" y="120" width="380" height="290" rx="20" fill="#f7fafd" stroke="#1565c0" stroke-width="3"/>
  <rect x="185" y="165" width="42" height="64" rx="21" fill="none" stroke="#1565c0" stroke-width="6"/>
  <path d="M 172 205 a 48 48 0 0 0 96 0" fill="none" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="253" x2="220" y2="278" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
  <text x="220" y="330" font-size="30" font-weight="bold" fill="#0d47a1" text-anchor="middle">SPEAK</text>
  <text x="220" y="368" font-size="22" fill="#4a6572" text-anchor="middle">push-to-talk,</text>
  <text x="220" y="394" font-size="22" fill="#4a6572" text-anchor="middle">any of 10 languages</text>

  <!-- Node 2: text -->
  <rect x="490" y="120" width="380" height="290" rx="20" fill="#eef4fb" stroke="#1565c0" stroke-width="3"/>
  <g stroke="#0d47a1" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 640 175 l -35 45 l 35 45"/>
    <path d="M 720 175 l 35 45 l -35 45"/>
  </g>
  <text x="680" y="238" font-size="26" font-weight="bold" fill="#0d47a1" text-anchor="middle">अ</text>
  <text x="680" y="330" font-size="30" font-weight="bold" fill="#0d47a1" text-anchor="middle">ON-DEVICE STT</text>
  <text x="680" y="368" font-size="22" fill="#4a6572" text-anchor="middle">speech → text, offline</text>
  <text x="680" y="394" font-size="22" fill="#4a6572" text-anchor="middle">VarnaCode: ~45 bytes/sentence</text>

  <!-- Node 3: link -->
  <rect x="950" y="120" width="380" height="290" rx="20" fill="#f7fcf7" stroke="#2e7d32" stroke-width="3"/>
  <g fill="none" stroke="#2e7d32" stroke-width="6" stroke-linecap="round">
    <line x1="1140" y1="278" x2="1140" y2="215"/>
    <path d="M 1114 278 l 26 -44 l 26 44"/>
    <path d="M 1108 196 a 44 44 0 0 1 64 0"/>
    <path d="M 1090 175 a 70 70 0 0 1 100 0"/>
  </g>
  <text x="1140" y="330" font-size="30" font-weight="bold" fill="#1b5e20" text-anchor="middle">ANY LINK</text>
  <text x="1140" y="368" font-size="22" fill="#4a6572" text-anchor="middle">Wi-Fi · Bluetooth · LoRa km-range</text>
  <text x="1140" y="394" font-size="22" fill="#4a6572" text-anchor="middle">works while towers are down</text>

  <!-- Node 4: speech out -->
  <rect x="1410" y="120" width="340" height="290" rx="20" fill="#fffaf6" stroke="#e65100" stroke-width="3"/>
  <polyline points="1520,235 1545,235 1580,200 1580,270 1545,235" fill="#e65100" stroke="#e65100" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 1598 214 a 30 30 0 0 1 0 42 M 1616 196 a 56 56 0 0 1 0 78" fill="none" stroke="#e65100" stroke-width="6" stroke-linecap="round"/>
  <text x="1580" y="330" font-size="30" font-weight="bold" fill="#bf360c" text-anchor="middle">HEAR</text>
  <text x="1580" y="368" font-size="22" fill="#4a6572" text-anchor="middle">natural TTS voice,</text>
  <text x="1580" y="394" font-size="22" fill="#4a6572" text-anchor="middle">alerts at max volume</text>

  <!-- arrows -->
  <g stroke="#455a64" stroke-width="4" fill="none" marker-end="url(#ar)">
    <line x1="416" y1="265" x2="482" y2="265"/>
    <line x1="876" y1="265" x2="942" y2="265"/>
    <line x1="1336" y1="265" x2="1402" y2="265"/>
  </g>

  <!-- caption band -->
  <rect x="30" y="470" width="1720" height="100" rx="16" fill="#16324a"/>
  <text x="890" y="532" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">Voice that travels as text — 100–600× less bandwidth than any voice codec</text>
</svg>
