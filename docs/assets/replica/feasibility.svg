<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1000" viewBox="0 0 1660 1000" font-family="Arial, Helvetica, sans-serif">
<rect width="1660" height="1000" fill="#eaf2fb"/>
<!-- left labels -->
<text x="70" y="180" font-size="64" font-weight="bold" fill="#16324a">Feasibility</text>
<text x="70" y="236" font-size="34" fill="#16324a">Can we build it?</text>
<g fill="none" stroke="#16324a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="150" cy="340" r="44"/><polyline points="126,340 142,356 176,322"/>
</g>
<text x="70" y="660" font-size="64" font-weight="bold" fill="#16324a">Viability</text>
<text x="70" y="716" font-size="34" fill="#16324a">Is it sustainable?</text>
<g fill="none" stroke="#16324a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
  <rect x="112" y="790" width="76" height="92" rx="10"/><polyline points="132,838 148,854 172,822"/>
</g>
<line x1="70" y1="510" x2="1590" y2="510" stroke="#a9c4de" stroke-width="3"/>

<!-- Tech -->
<text x="720" y="110" font-size="40" font-weight="bold" fill="#16324a" text-anchor="middle">Tech</text>
<g transform="translate(660,140)" fill="none" stroke="#16324a" stroke-width="8" stroke-linecap="round">
  <rect x="26" y="26" width="72" height="72" rx="8"/><line x1="44" y1="10" x2="44" y2="26"/><line x1="62" y1="10" x2="62" y2="26"/><line x1="80" y1="10" x2="80" y2="26"/><line x1="44" y1="98" x2="44" y2="114"/><line x1="62" y1="98" x2="62" y2="114"/><line x1="80" y1="98" x2="80" y2="114"/>
</g>
<g font-size="34" fill="#16324a" text-anchor="middle">
  <text x="720" y="318">Real-speech CER 2.9 %</text>
  <text x="720" y="366">RTF 0.06 · int8 140 MB</text>
</g>

<!-- Operational -->
<text x="1240" y="110" font-size="40" font-weight="bold" fill="#16324a" text-anchor="middle">Operational</text>
<g transform="translate(1180,140)" fill="none" stroke="#16324a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 62 10 l 48 26 v 52 c 0 30 -22 50 -48 60 c -26 -10 -48 -30 -48 -60 v -52 z"/><polyline points="42,68 58,84 84,52"/>
</g>
<g font-size="34" fill="#16324a" text-anchor="middle">
  <text x="1240" y="318">Fallback at every layer:</text>
  <text x="1240" y="366">int8 · eSpeak-NG · hotspot</text>
</g>

<!-- Market -->
<text x="720" y="590" font-size="40" font-weight="bold" fill="#16324a" text-anchor="middle">Market</text>
<g transform="translate(660,620)" fill="none" stroke="#16324a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 20 50 h 30 l 46 -30 v 80 l -46 -30 h -30 z"/><path d="M 104 40 a 20 20 0 0 1 0 40"/>
</g>
<g font-size="34" fill="#16324a" text-anchor="middle">
  <text x="720" y="798">₹0 recurring · own phones</text>
  <text x="720" y="846">₹1,650 node vs ₹8–25k radios</text>
</g>

<!-- Scalability -->
<text x="1240" y="590" font-size="40" font-weight="bold" fill="#16324a" text-anchor="middle">Scalability</text>
<g transform="translate(1180,620)" fill="none" stroke="#16324a" stroke-width="8" stroke-linecap="round">
  <line x1="30" y1="110" x2="30" y2="70"/><line x1="62" y1="110" x2="62" y2="46"/><line x1="94" y1="110" x2="94" y2="24"/><path d="M 20 40 l 30 -22 l 24 14 l 30 -24" stroke-width="7"/>
</g>
<g font-size="34" fill="#16324a" text-anchor="middle">
  <text x="1240" y="798">One model family, 22 languages</text>
  <text x="1240" y="846">any bearer — BT to GSAT</text>
</g>
</svg>
