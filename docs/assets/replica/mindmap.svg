  <path d="M 1520 410 a 55 55 0 0 1 0 60 M 1548 385 a 90 90 0 0 1 0 110" />
</g>
<text x="1460" y="600" font-size="46" font-weight="bold" fill="#1f2937" text-anchor="middle">iTantra</text>
<text x="1460" y="645" font-size="28" fill="#5f6b7a" text-anchor="middle">Semantic Transceiver</text>

<!-- helper: pills -->
<g font-size="46" font-weight="bold" fill="#1f2937">
 <!-- LEFT -->
 <rect x="230" y="70" width="560" height="96" rx="22" fill="url(#gBlue)" stroke="#1f2937" stroke-width="4"/><text x="510" y="134" text-anchor="middle">On-device STT</text>
 <rect x="130" y="310" width="560" height="96" rx="22" fill="url(#gPurple)" stroke="#1f2937" stroke-width="4"/><text x="410" y="370" text-anchor="middle">VarnaCode</text>
 <rect x="130" y="550" width="560" height="96" rx="22" fill="url(#gGreen)" stroke="#1f2937" stroke-width="4"/><text x="410" y="610" text-anchor="middle">Any Bearer</text>
 <rect x="230" y="790" width="560" height="96" rx="22" fill="url(#gPink)" stroke="#1f2937" stroke-width="4"/><text x="510" y="850" text-anchor="middle">Prosody Byte</text>
 <!-- RIGHT -->
 <rect x="2130" y="70" width="560" height="96" rx="22" fill="url(#gOrange)" stroke="#1f2937" stroke-width="4"/><text x="2410" y="134" text-anchor="middle">Natural TTS</text>
 <rect x="2230" y="310" width="560" height="96" rx="22" fill="url(#gRed)" stroke="#1f2937" stroke-width="4"/><text x="2510" y="370" text-anchor="middle">Alert Mode</text>
 <rect x="2230" y="550" width="560" height="96" rx="22" fill="url(#gYellow)" stroke="#1f2937" stroke-width="4"/><text x="2510" y="610" text-anchor="middle">Evaluation Mode</text>
 <rect x="2130" y="790" width="560" height="96" rx="22" fill="url(#gLime)" stroke="#1f2937" stroke-width="4"/><text x="2410" y="850" text-anchor="middle">Secure &amp; Offline</text>
</g>
<!-- sub labels -->
<g font-size="36" fill="#374151">
 <text x="760" y="212" text-anchor="end">IndicConformer int8 · 10 languages</text><text x="760" y="252" text-anchor="end">Silero VAD streams sentences</text>
 <text x="660" y="452" text-anchor="end">4.45–5.41 bits/char, measured</text><text x="660" y="492" text-anchor="end">~45 bytes per sentence</text>
 <text x="660" y="692" text-anchor="end">Wi-Fi · Bluetooth · LoRa</text><text x="660" y="732" text-anchor="end">AFSK through analog radios</text>
 <text x="760" y="932" text-anchor="end">urgency survives the text</text><text x="760" y="972" text-anchor="end">far end: faster, louder, twice</text>
 <text x="2160" y="212">FastPitch / Piper (MIT)</text><text x="2160" y="252">sentence-streamed · eSpeak fallback</text>
 <text x="2260" y="452">max volume · non-interruptible</text><text x="2260" y="492">CAP / SACHET bridge</text>
 <text x="2260" y="692">live CER · RTF · latency</text><text x="2260" y="732">real-speech Hindi CER 2.9%</text>
 <text x="2160" y="932">AES-128-GCM · 73 B encrypted</text><text x="2160" y="972">zero network calls</text>
</g>
