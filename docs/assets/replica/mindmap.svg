<svg xmlns="http://www.w3.org/2000/svg" width="2920" height="1000" viewBox="0 0 2920 1000" font-family="Arial, Helvetica, sans-serif">
<defs>
  <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE6FF"/><stop offset="1" stop-color="#5CC3F5"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4D3FF"/><stop offset="1" stop-color="#B58CF0"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9F5D6"/><stop offset="1" stop-color="#6FD68C"/></linearGradient>
  <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC7DE"/><stop offset="1" stop-color="#F58BB4"/></linearGradient>
  <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD9B8"/><stop offset="1" stop-color="#F7A55A"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC9C4"/><stop offset="1" stop-color="#F58A80"/></linearGradient>
  <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset="1" stop-color="#F7D95A"/></linearGradient>
  <linearGradient id="gLime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F7B0"/><stop offset="1" stop-color="#B7DF5A"/></linearGradient>
  <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F3F6"/><stop offset="1" stop-color="#C9CFD8"/></linearGradient>
</defs>
<rect width="2920" height="1000" fill="#ffffff"/>
<!-- center -->
<rect x="1240" y="330" width="440" height="340" rx="34" fill="url(#gGray)" stroke="#5f6b7a" stroke-width="5"/>
<g fill="none" stroke="#3a4552" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <rect x="1425" y="380" width="70" height="100" rx="35"/>
  <path d="M 1400 450 a 60 60 0 0 0 120 0"/>
