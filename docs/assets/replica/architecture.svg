  <text x="50" y="140" font-size="20" fill="#607d8b" text-anchor="middle">IN865 · 1–10 km · ₹1,650</text>
</g>
<g transform="translate(810,760)">
  <path d="M 8 44 q 14 -34 28 0 t 28 0 t 28 0" fill="none" stroke="#37474f" stroke-width="4" stroke-linecap="round"/>
  <rect x="34" y="52" width="32" height="26" rx="4" fill="none" stroke="#37474f" stroke-width="4"/>
  <text x="50" y="112" font-size="25" font-weight="bold" fill="#263238" text-anchor="middle">AFSK modem</text>
  <text x="50" y="140" font-size="20" fill="#607d8b" text-anchor="middle">0.3 s of audio · any radio</text>
</g>
<rect x="90" y="960" width="860" height="150" rx="14" fill="#ffffff" stroke="#a5d6a7" stroke-width="2"/>
<g font-size="18" fill="#37474f">
  <text x="112" y="998" font-weight="bold">ARQ &amp; store-and-forward</text>
  <text x="112" y="1028">seq-numbered frames · ACK / retransmit on lossy bearers · queued while the peer is away</text>
  <text x="112" y="1058">LoRa duty-cycle guard 1 % · ~116 sentences / hour at SF9 · CRC-16 on every frame</text>
  <text x="112" y="1088" fill="#607d8b">Measured: 45 B VarnaCode vs 7,625 B AMR-NB vs 40,000 B raw voice per sentence</text>
</g>

