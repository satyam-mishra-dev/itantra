<!-- roll-call / CAP strip -->
<rect x="1130" y="600" width="880" height="200" rx="14" fill="#ffffff" stroke="#ffcc80" stroke-width="2"/>
<g font-size="18" fill="#37474f">
  <text x="1152" y="640" font-weight="bold">Extra frames on the same protocol</text>
  <text x="1152" y="672"><tspan font-weight="bold">Roll-call:</tspan> question broadcast once → 9-byte SAFE / NEED HELP / SOS replies → live headcount</text>
  <text x="1152" y="702"><tspan font-weight="bold">CAP / SACHET bridge:</tspan> official NDMA alert XML → spoken ALERT in the village language</text>
  <text x="1152" y="732"><tspan font-weight="bold">Prosody:</tspan> PANIC frames play faster, louder and twice — even without the ALERT flag</text>
  <text x="1152" y="762" fill="#607d8b">walkie-talkie off ⇒ the phone behaves 100 % normally</text>
</g>

<!-- runtime strip -->
<rect x="1130" y="840" width="880" height="270" rx="14" fill="#fafafa" stroke="#b0bec5" stroke-width="2" stroke-dasharray="7 5"/>
<g font-size="18" fill="#37474f">
  <text x="1152" y="880" font-weight="bold">On-device runtime (both phones)</text>
  <text x="1152" y="914">sherpa-onnx · ONNX Runtime — one JNI surface for STT, TTS and VAD</text>
  <text x="1152" y="944">Kotlin foreground service + audio focus (Android 14+) · 54 MB APK</text>
  <text x="1152" y="974">language packs ~200 MB (int8 STT 140 MB + Piper 63 MB), sideloadable</text>
  <text x="1152" y="1004">eSpeak-NG fallback — no language is ever silent</text>
  <text x="1152" y="1034" fill="#607d8b">MIT / Apache models · zero network calls · Bhashini-lineage AI4Bharat</text>
  <text x="1152" y="1080" fill="#e65100" font-weight="bold">Measured: real-speech CER hi 2.9 % · RTF 0.06 · TTS RTF 0.049</text>
</g>

