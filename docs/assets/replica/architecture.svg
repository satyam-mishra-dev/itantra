<text x="110" y="370" font-size="18" fill="#546e7a">frame header:</text>
<text x="110" y="396" font-size="18" fill="#546e7a">lang · priority · seq · CRC-16</text>
<text x="110" y="440" font-size="18" fill="#546e7a">sentence 1 transmits while</text>
<text x="110" y="466" font-size="18" fill="#546e7a">sentence 2 is still being spoken</text>
<text x="110" y="540" font-size="17" fill="#90a4ae">↓ frames leave the phone on any bearer below</text>

<!-- ============ LOW-BITRATE LINK ============ -->
<rect x="40" y="660" width="960" height="500" rx="22" fill="#f6fbf6" stroke="#2e7d32" stroke-width="3"/>
